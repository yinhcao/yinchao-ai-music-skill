name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Skill
        run: python tools/validate_skill.py --expected-channel github

      - name: Compile script
        run: python -m py_compile skills/yinchao-ai-music/scripts/yinchao_music.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
